<script>
    // ========== УНИВЕРСАЛЬНЫЙ STORAGE (CloudStorage + localStorage fallback) ==========
    const tg = window.Telegram.WebApp || {};
    tg.expand?.();
    
    const Storage = {
        // Автоматически определяет, работает ли CloudStorage
        isCloud: !!(tg.CloudStorage && tg.CloudStorage.getItem),
        
        getItem(key, callback) {
            if (this.isCloud) {
                tg.CloudStorage.getItem(key, callback);
            } else {
                // Fallback для браузера
                setTimeout(() => {
                    try {
                        const val = localStorage.getItem('tga_' + key);
                        callback(null, val);
                    } catch(e) { callback(e, null); }
                }, 10);
            }
        },
        
        setItem(key, value, callback) {
            if (this.isCloud) {
                tg.CloudStorage.setItem(key, value, callback);
            } else {
                localStorage.setItem('tga_' + key, value);
                setTimeout(() => callback?.(), 10);
            }
        },
        
        removeItem(key, callback) {
            if (this.isCloud) {
                tg.CloudStorage.removeItem(key, callback);
            } else {
                localStorage.removeItem('tga_' + key);
                setTimeout(() => callback?.(), 10);
            }
        },
        
        getKeys(callback) {
            if (this.isCloud) {
                tg.CloudStorage.getKeys(callback);
            } else {
                // Собираем ключи из localStorage с нашим префиксом
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k?.startsWith('tga_')) {
                        keys.push(k.replace('tga_', ''));
                    }
                }
                setTimeout(() => callback(null, keys), 10);
            }
        }
    };

    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    const APP_VERSION = "1.1.0";
    document.getElementById('version-tag')?.textContent = 'v' + APP_VERSION;

    let allData = { lessons: [], dz: [], students: [] };
    let editKey = null;
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let selectedDate = new Date().toISOString().split('T')[0];
    let isDataLoaded = false; // Флаг: данные загружены?

    // ========== UI: МЕНЮ ==========
    function toggleMenu() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('burgerBtn');
        const isOpen = menu.classList.toggle('open');
        overlay.classList.toggle('show', isOpen);
        btn.classList.toggle('active', isOpen);
        // Блокируем скролл основного контента
        document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    function closeMenu() {
        document.getElementById('sideMenu')?.classList.remove('open');
        document.getElementById('overlay')?.classList.remove('show');
        document.getElementById('burgerBtn')?.classList.remove('active');
        document.body.style.overflow = '';
    }

    function navigateTo(page) {
        closeMenu();
        document.querySelectorAll('.side-menu .menu-item').forEach(i => i.classList.remove('active'));
        const item = document.querySelector(`.side-menu .menu-item[onclick*="${page}"]`);
        item?.classList.add('active');
        
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + page)?.classList.add('active');
        
        // Если данные уже загружены — рендерим сразу, иначе ждём
        if (isDataLoaded) renderPage(page);
        else renderAll();
    }

    function renderPage(page) {
        switch(page) {
            case 'home': renderHome(); break;
            case 'finance': renderFinance(); renderRecentLessons(); break;
            case 'calendar': renderCalendar(); break;
            case 'lessons': renderLessons(); break;
            case 'diary': renderDiary(); break;
            case 'students': renderStudents(); break;
        }
    }

    // ========== УЧЕНИКИ ==========
    function loadStudents() {
        try {
            const stored = localStorage.getItem('tga_students_cache');
            return stored ? JSON.parse(stored) : [];
        } catch { return []; }
    }

    function saveStudents(students) {
        localStorage.setItem('tga_students_cache', JSON.stringify(students));
    }

    function addStudent() {
        const input = document.getElementById('new-student-name');
        const name = input?.value.trim();
        if (!name) { tg.showAlert?.('Введите имя ученика'); return; }
        
        let students = loadStudents();
        if (students.includes(name)) { tg.showAlert?.('⚠️ Ученик уже существует'); return; }
        
        students.push(name);
        saveStudents(students);
        
        // Оптимистичное обновление UI
        allData.students = students;
        input.value = '';
        renderStudents();
        Storage.setItem('students_list', JSON.stringify(students), () => {
            tg.showAlert?.('✅ Ученик добавлен!');
        });
    }

    // ========== ЗАНЯТИЯ ==========
    function addLesson() {
        const name = document.getElementById('stu-name')?.value.trim();
        const price = document.getElementById('stu-price')?.value.trim();
        const topic = document.getElementById('stu-topic')?.value.trim();
        const duration = document.getElementById('stu-duration')?.value.trim() || 60;
        const date = document.getElementById('stu-date')?.value || new Date().toISOString().split('T')[0];
        const paid = document.getElementById('stu-paid')?.checked;
        const notes = document.getElementById('stu-notes')?.value.trim();

        if (!name || !price) { tg.showAlert?.('Заполните имя и стоимость!'); return; }

        // Добавляем ученика в список, если нет
        let students = loadStudents();
        if (!students.includes(name)) {
            students.push(name);
            saveStudents(students);
            allData.students = students;
            Storage.setItem('students_list', JSON.stringify(students), () => {});
        }

        const lesson = {
            name, price: Number(price), topic, duration: Number(duration), date,
            paid, notes, cancelled: false, created: Date.now()
        };

        const key = 'lesson_' + Date.now();
        
        // === ОПТИМИСТИЧНОЕ ОБНОВЛЕНИЕ: сразу добавляем в UI ===
        allData.lessons.push({ ...lesson, key });
        renderAll(); // Мгновенный ререндер всех виджетов
        
        Storage.setItem(key, JSON.stringify(lesson), () => {
            // Сброс формы
            ['stu-name','stu-topic','stu-price','stu-duration','stu-notes'].forEach(id => {
                const el = document.getElementById(id); if (el) el.value = '';
            });
            const dateEl = document.getElementById('stu-date');
            if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
            const paidEl = document.getElementById('stu-paid');
            if (paidEl) paidEl.checked = false;
            
            tg.showAlert?.('✅ Занятие добавлено!');
            
            // Если добавили занятие на текущий месяц — обновляем календарь
            const lessonDate = new Date(date);
            if (lessonDate.getMonth() === currentMonth && lessonDate.getFullYear() === currentYear) {
                renderCalendar();
            }
        });
    }

    // ========== ДЗ ==========
    function saveDZ() {
        const name = document.getElementById('dz-name')?.value.trim();
        const text = document.getElementById('dz-text')?.value.trim();
        const topic = document.getElementById('dz-topic')?.value.trim();
        if (!name || !text) { tg.showAlert?.('Заполните имя и задание!'); return; }
        
        const dz = { name, topic, text, date: new Date().toLocaleDateString('ru'), created: Date.now() };
        const key = 'dz_' + Date.now();
        
        allData.dz.push({ ...dz, key });
        renderDiary();
        
        Storage.setItem(key, JSON.stringify(dz), () => {
            ['dz-name','dz-topic','dz-text'].forEach(id => {
                const el = document.getElementById(id); if (el) el.value = '';
            });
            tg.showAlert?.('✅ ДЗ сохранено!');
        });
    }

    // ========== ЗАГРУЗКА ДАННЫХ ==========
    function loadAllData(callback) {
        Storage.getKeys((err, keys) => {
            if (err || !keys) { 
                allData.students = loadStudents();
                isDataLoaded = true;
                callback?.(); 
                return; 
            }
            
            let loaded = 0;
            const total = keys.length;
            allData = { lessons: [], dz: [], students: [] };

            if (total === 0) { 
                allData.students = loadStudents();
                isDataLoaded = true;
                callback?.(); 
                return; 
            }

            keys.forEach(k => {
                Storage.getItem(k, (err, val) => {
                    loaded++;
                    try {
                        const d = JSON.parse(val || '{}');
                        if (k.startsWith('lesson_')) allData.lessons.push({ ...d, key: k });
                        else if (k.startsWith('dz_')) allData.dz.push({ ...d, key: k });
                        else if (k === 'students_list') { allData.students = d; saveStudents(d); }
                    } catch(e) { console.warn('Parse error:', k, e); }
                    
                    if (loaded === total) {
                        if (allData.students.length === 0) allData.students = loadStudents();
                        isDataLoaded = true;
                        callback?.();
                    }
                });
            });
        });
    }

    // ========== РЕНДЕР: ГЛАВНАЯ ==========
    function renderHome() {
        const today = new Date().toISOString().split('T')[0];
        const todayLessons = allData.lessons.filter(l => l.date === today && !l.cancelled);
        const todayCount = todayLessons.length;
        const todayProfit = todayLessons.reduce((sum, l) => sum + (Number(l.price)||0), 0);
        const now = new Date();
        const dateStr = now.toLocaleDateString('ru', { weekday: 'long', day: 'numeric', month: 'long' });
        
        const elDate = document.getElementById('greeting-date');
        const elCount = document.getElementById('today-count');
        const elProfit = document.getElementById('today-profit');
        if (elDate) elDate.textContent = 'Сегодня ' + dateStr;
        if (elCount) elCount.textContent = todayCount;
        if (elProfit) elProfit.textContent = todayProfit + ' ₽';
    }

    // ========== РЕНДЕР: ФИНАНСЫ ==========
    function renderFinance() {
        const lessons = allData.lessons.filter(l => !l.cancelled);
        const cancelled = allData.lessons.filter(l => l.cancelled);
        const recurring = allData.lessons.filter(l => l.recurring && l.recurring !== 'none');
        
        const total = lessons.length;
        const totalProfit = lessons.reduce((sum, l) => sum + (Number(l.price)||0), 0);
        const paidProfit = lessons.filter(l => l.paid).reduce((sum, l) => sum + (Number(l.price)||0), 0);
        const unpaidProfit = lessons.filter(l => !l.paid).reduce((sum, l) => sum + (Number(l.price)||0), 0);
        
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
        set('total-count', total);
        set('total-profit', totalProfit + ' ₽');
        set('paid-profit', paidProfit + ' ₽');
        set('unpaid-profit', unpaidProfit + ' ₽');
        set('cancelled-count', cancelled.length);
        set('recurring-count', recurring.length);
    }

    function renderRecentLessons() {
        const container = document.getElementById('lessons-list');
        if (!container) return;
        const recent = allData.lessons.filter(l => !l.cancelled).sort((a,b) => b.created - a.created).slice(0, 5);
        
        if (recent.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;color:#b8a090;">Нет занятий</div>';
            return;
        }
        container.innerHTML = recent.map(l => `
            <div class="card card-small" onclick="openEditModal('${l.key}')">
                <div style="display:flex;justify-content:space-between;">
                    <b style="color:#4a3728;">${l.name}</b>
                    <span class="badge ${l.paid ? 'badge-green' : 'badge-red'}">${l.paid ? '✅' : '❌'}</span>
                </div>
                <div style="font-size:14px;color:#8a7a6a;">
                    ${l.topic ? l.topic + ' • ' : ''}${l.date} • ${l.price} ₽
                </div>
            </div>
        `).join('');
    }

    // ========== РЕНДЕР: СПИСОК ЗАНЯТИЙ ==========
    function renderLessons() {
        const filter = (document.getElementById('filter-name')?.value || '').toLowerCase();
        const container = document.getElementById('all-lessons-list');
        if (!container) return;
        
        const filtered = allData.lessons
            .filter(l => l.name.toLowerCase().includes(filter))
            .sort((a, b) => b.created - a.created);
            
        if (filtered.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;color:#b8a090;">Нет занятий</div>';
            return;
        }
        container.innerHTML = filtered.map(l => {
            const badge = l.cancelled ? '<span class="badge badge-gray">❌ Отменено</span>' :
                         l.paid ? '<span class="badge badge-green">✅ Оплачено</span>' :
                         '<span class="badge badge-red">❌ Не оплачено</span>';
            return `
                <div class="card card-small" onclick="openEditModal('${l.key}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <b style="color:#4a3728;">${l.name}</b>
                        ${badge}
                    </div>
                    <div style="margin-top:5px;font-size:14px;color:#8a7a6a;">
                        ${l.topic ? '<span class="tag">📖 ' + l.topic + '</span>' : ''}
                        ${l.duration ? '<span class="tag">⏱ ' + l.duration + ' мин</span>' : ''}
                        <span class="tag">📅 ${l.date}</span>
                        <span class="tag">💰 ${l.price} ₽</span>
                    </div>
                    ${l.notes ? '<div style="font-size:13px;color:#b8a090;margin-top:4px;">📝 ' + l.notes + '</div>' : ''}
                </div>
            `;
        }).join('');
    }

    // ========== РЕНДЕР: КАЛЕНДАРЬ (ИСПРАВЛЕННЫЙ) ==========
    function renderCalendar() {
        const container = document.getElementById('calendar-grid');
        const monthLabel = document.getElementById('calendar-month');
        if (!container) return;

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const today = new Date().toISOString().split('T')[0];

        if (monthLabel) {
            monthLabel.textContent = new Date(currentYear, currentMonth).toLocaleString('ru', { month: 'long', year: 'numeric' });
        }

        let html = '';
        ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => 
            html += `<div style="font-weight:600;text-align:center;font-size:12px;color:#b8a090;">${d}</div>`
        );

        let startOffset = (firstDay === 0) ? 6 : firstDay - 1;
        for (let i = 0; i < startOffset; i++) {
            html += '<div class="calendar-day" style="background:transparent;border:none;pointer-events:none;"></div>';
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const hasLesson = allData.lessons.some(l => l.date === dateStr && !l.cancelled);
            const isToday = dateStr === today;
            const isSelected = dateStr === selectedDate;
            const dayObj = new Date(currentYear, currentMonth, day);
            const isWeekend = dayObj.getDay() === 0 || dayObj.getDay() === 6;
            
            let cls = 'calendar-day';
            if (hasLesson) cls += ' has-lesson';
            if (isToday) cls += ' today';
            if (isSelected) cls += ' selected';
            if (isWeekend && !hasLesson && !isSelected) cls += ' weekend';
            
            // Добавляем data-атрибут для надёжности + onclick
            html += `<div class="${cls}" data-date="${dateStr}" onclick="selectDate('${dateStr}')">${day}</div>`;
        }

        container.innerHTML = html;
        showDateLessons(selectedDate);
    }

    function selectDate(date) {
        selectedDate = date;
        renderCalendar(); // Перерисовываем календарь с новым выделением
        // Прокручиваем к списку занятий, если на мобильном
        setTimeout(() => {
            document.getElementById('calendar-lessons')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    function showDateLessons(date) {
        const container = document.getElementById('calendar-lessons');
        if (!container) return;
        
        const lessons = allData.lessons.filter(l => l.date === date && !l.cancelled);
        const dateRu = new Date(date).toLocaleDateString('ru', { day: 'numeric', month: 'long' });
        
        if (lessons.length === 0) {
            container.innerHTML = `<div class="card" style="text-align:center;color:#b8a090;">На ${dateRu} занятий нет</div>`;
            return;
        }
        container.innerHTML = `
            <h4 style="margin:10px 0; color:#4a3728;">📅 ${dateRu}</h4>
            ${lessons.map(l => `
                <div class="card card-small" onclick="openEditModal('${l.key}')">
                    <b style="color:#4a3728;">${l.name}</b> — ${l.price} ₽
                    ${l.topic ? '<div style="font-size:13px;color:#8a7a6a;">' + l.topic + '</div>' : ''}
                    ${l.paid ? '<span class="badge badge-green">✅ Оплачено</span>' : '<span class="badge badge-red">❌ Не оплачено</span>'}
                </div>
            `).join('')}
        `;
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    // ========== РЕНДЕР: УЧЕНИКИ ==========
    function renderStudents() {
        const container = document.getElementById('students-list');
        if (!container) return;
        const students = allData.students || [];
        
        if (students.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;color:#b8a090;">Нет учеников</div>';
            return;
        }
        
        const stats = {};
        allData.lessons.filter(l => !l.cancelled).forEach(l => {
            if (!stats[l.name]) stats[l.name] = { count: 0, total: 0 };
            stats[l.name].count++;
            stats[l.name].total += Number(l.price) || 0;
        });
        
        container.innerHTML = students.map(name => {
            const s = stats[name] || { count: 0, total: 0 };
            return `
                <div class="card card-small" onclick="filterByStudent('${name}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <b style="color:#4a3728;">${name}</b>
                        <span class="badge badge-yellow">${s.count} занятий</span>
                    </div>
                    <div style="font-size:14px;color:#8a7a6a;margin-top:5px;">
                        💰 Всего: ${s.total} ₽
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterByStudent(name) {
        navigateTo('lessons');
        setTimeout(() => {
            const input = document.getElementById('filter-name');
            if (input) { input.value = name; renderLessons(); }
        }, 100);
    }

    // ========== РЕНДЕР: ДНЕВНИК ==========
    function renderDiary() {
        const container = document.getElementById('diary-list');
        if (!container) return;
        if (allData.dz.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;color:#b8a090;">Нет домашних заданий</div>';
            return;
        }
        container.innerHTML = allData.dz.sort((a, b) => b.created - a.created).map(d => `
            <div class="card card-small dz-item">
                <div style="display:flex;justify-content:space-between;">
                    <b style="color:#4a3728;">${d.name}</b>
                    <span style="font-size:12px;color:#b8a090;">${d.date}</span>
                </div>
                ${d.topic ? '<div style="font-size:13px;color:#8a7a6a;">📖 ' + d.topic + '</div>' : ''}
                <div style="margin-top:8px; color:#4a3728;">${d.text}</div>
            </div>
        `).join('');
    }

    // ========== МОДАЛКА: РЕДАКТИРОВАНИЕ ==========
    function openEditModal(key) {
        const lesson = allData.lessons.find(l => l.key === key);
        if (!lesson) return;
        editKey = key;
        
        const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val ?? ''; };
        const setChk = (id, val) => { const el = document.getElementById(id); if (el) el.checked = !!val; };
        
        setVal('edit-name', lesson.name);
        setVal('edit-topic', lesson.topic);
        setVal('edit-price', lesson.price);
        setVal('edit-duration', lesson.duration);
        setVal('edit-date', lesson.date);
        setVal('edit-notes', lesson.notes);
        setChk('edit-paid', lesson.paid);
        setChk('edit-cancelled', lesson.cancelled);
        
        document.getElementById('edit-modal')?.classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('edit-modal')?.classList.remove('active');
        editKey = null;
    }

    function saveEdit() {
        if (!editKey) return;
        const name = document.getElementById('edit-name')?.value.trim();
        const price = document.getElementById('edit-price')?.value.trim();
        if (!name || !price) { tg.showAlert?.('Заполните имя и стоимость!'); return; }
        
        const updated = {
            name,
            price: Number(price),
            topic: document.getElementById('edit-topic')?.value.trim(),
            duration: Number(document.getElementById('edit-duration')?.value) || 60,
            date: document.getElementById('edit-date')?.value,
            notes: document.getElementById('edit-notes')?.value.trim(),
            paid: document.getElementById('edit-paid')?.checked,
            cancelled: document.getElementById('edit-cancelled')?.checked
        };
        
        // Находим старое занятие, чтобы сохранить created и recurring
        const old = allData.lessons.find(l => l.key === editKey);
        if (old) {
            updated.created = old.created;
            updated.recurring = old.recurring || 'none';
        }
        
        // Оптимистичное обновление в UI
        const idx = allData.lessons.findIndex(l => l.key === editKey);
        if (idx !== -1) allData.lessons[idx] = { ...updated, key: editKey };
        renderAll();
        
        Storage.setItem(editKey, JSON.stringify(updated), () => {
            closeEditModal();
            tg.showAlert?.('✅ Изменения сохранены!');
        });
    }

    function deleteLessonFromModal() {
        if (!editKey) return;
        if (!confirm('Удалить занятие?')) return;
        
        // Удаляем из UI сразу
        allData.lessons = allData.lessons.filter(l => l.key !== editKey);
        renderAll();
        
        Storage.removeItem(editKey, () => {
            closeEditModal();
            tg.showAlert?.('🗑 Занятие удалено');
        });
    }

    // ========== ГЛОБАЛЬНЫЙ РЕНДЕР ==========
    function renderAll() {
        renderHome();
        renderFinance();
        renderRecentLessons();
        renderLessons();
        renderStudents();
        renderDiary();
        // Календарь рендерим только если он сейчас активен (чтобы не тратить ресурсы)
        if (document.getElementById('page-calendar')?.classList.contains('active')) {
            renderCalendar();
        }
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    document.addEventListener('DOMContentLoaded', () => {
        // Устанавливаем сегодняшнюю дату в формы
        const today = new Date().toISOString().split('T')[0];
        ['stu-date', 'edit-date'].forEach(id => {
            const el = document.getElementById(id); if (el) el.value = today;
        });
        selectedDate = today;
        
        // Загружаем данные и рендерим
        loadAllData(() => {
            renderAll();
        });
        
        // Закрытие модального окна по клику на фон
        document.getElementById('edit-modal')?.addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });
        
        // Для отладки в консоли
        console.log('🚀 App loaded. Storage mode:', Storage.isCloud ? 'Cloud' : 'localStorage');
        console.log('📦 Data:', allData);
    });
</script>
