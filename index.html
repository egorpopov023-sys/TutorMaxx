<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Ежедневник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #fff; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #2481cc; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Финансы</h3>
    <input type="text" id="desc" placeholder="Описание">
    <input type="number" id="sum" placeholder="Сумма">
    <button onclick="saveData()">Сохранить в Telegram</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function saveData() {
            const desc = document.getElementById('desc').value;
            const sum = document.getElementById('sum').value;
            const key = 'data_' + Date.now();
            const value = JSON.stringify({ desc, sum, time: new Date().toLocaleString() });

            tg.CloudStorage.setItem(key, value, (err, res) => {
                if (res) {
                    alert('Успешно сохранено!');
                    document.getElementById('desc').value = '';
                    document.getElementById('sum').value = '';
                } else {
                    alert('Ошибка: ' + err);
                }
            });
        }
    </script>
</body>
</html>
